  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#dfe7f0;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  body{
    font-family:"Microsoft YaHei Light","Microsoft YaHei UI Light","Microsoft YaHei UI","Microsoft YaHei",
                "PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",sans-serif;
    font-weight:300;
    color:var(--ink-soft);
    user-select:none;
    cursor:default;
  }

  /* ---------- 1920×1080 舞台，整体等比缩放 ---------- */
  .stage{
    position:absolute;
    left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--scale,1));
    background:#eef5fb;
    overflow:hidden;
  }

  /* ---------- 左栏：品牌 + 主图 ---------- */
  .brand-col{
    position:absolute;
    left:101px; top:176px;
    width:1047px;
    text-align:center;
  }

  /* 品牌锁形（字标 + 英文案）—— 位图，按参考图 1:1 尺寸摆放 */
  .lockup{
    position:absolute;
    left:276px; top:21px;
    width:496px; height:143px;
    display:block;
    pointer-events:none;
  }

  /* 主图白框 */
  .hero-frame{
    position:absolute;
    left:0; top:201px;
    width:1047px; height:611px;
    padding:19px;
    background:#fff;
    box-shadow:0 14px 36px rgba(48,72,96,.13), 0 2px 6px rgba(48,72,96,.06);
  }

  .hero-media{
    position:relative;
    width:100%; height:100%;
    overflow:hidden;
    background:#c9d5e0;
  }
  .hero-media::after{  /* 图片内缘极细描边，贴合参考图里的层次 */
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 0 1px rgba(30,50,70,.10);
    pointer-events:none;
    z-index:3;
  }

  .slide{
    position:absolute; inset:0;
    background-image:url("assets/photos/hero-placeholder.svg");
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity .9s ease;
    transform:scale(1.001);
    z-index:1;
  }
  .slide.is-on{ opacity:1; }

  /* 首帧不要淡入，避免打开瞬间看到空白 */
  .hero-media.is-booting .slide{ transition:none; }

  /* 轮播圆点 */
  .dots{
    position:absolute;
    left:50%; bottom:47px;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:4px;
    z-index:5;
  }
  .dot{
    width:13px; height:13px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(30,45,60,.14), 0 1px 4px rgba(24,40,56,.35);
    cursor:pointer;
    transition:background .3s ease;
  }
  .dot.is-on{
    background:#fff;
  }

  /* ---------- 右上：日期 / 时间 / 天气 ---------- */
  .statusbar{
    position:absolute;
    left:1232px; top:44px;
    width:572px;
    padding-right:7px;
    display:flex; align-items:center; justify-content:flex-end;
    font-family:"Segoe UI Light","Segoe UI","Microsoft YaHei UI Light",sans-serif;
    font-size:28px;
    line-height:40px;
    letter-spacing:.04em;
    color:#3f4f45;
  }
  .clock-date{ font-variant-numeric:tabular-nums; }
  .clock-time{ margin-left:57px; font-variant-numeric:tabular-nums; }
  .weather{
    margin-left:70px;
    display:flex; align-items:center; gap:10px;
  }
  .weather svg{ width:58px; height:58px; display:block; }
  .temp{ font-size:30px; font-variant-numeric:tabular-nums; }

  /* ---------- 右侧 2×3 功能宫格 ---------- */
  .grid{
    position:absolute;
    left:1233px; top:132px;
    width:568px;
    display:grid;
    grid-template-columns:repeat(2,280px);
    grid-auto-rows:280px;
    gap:8px;
  }

  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0 10px 51px;
    background:#fff;
    border:1px solid #e2e9ef;
    color:var(--ink);
    font-family:inherit;
    text-align:center;
    cursor:pointer;
    outline:none;
    transition:background .22s ease, color .22s ease, border-color .22s ease;
  }
  /* 图标：从参考图提取的 alpha 蒙版，用 currentColor 着色，选中态自动变白 */
  .tile .ico{
    width:130px; height:130px;
    display:block;
    margin-bottom:24px;
    flex:none;
    background-color:currentColor;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    transition:background-color .22s ease;
  }
  .ico--tv{     -webkit-mask-image:var(--ico-tv);     mask-image:var(--ico-tv); }
  .ico--hotel{  -webkit-mask-image:var(--ico-hotel);  mask-image:var(--ico-hotel); }
  .ico--aurora{ -webkit-mask-image:var(--ico-aurora); mask-image:var(--ico-aurora); }
  .ico--cast{   -webkit-mask-image:var(--ico-cast);   mask-image:var(--ico-cast); }
  .ico--asr{    -webkit-mask-image:var(--ico-asr);    mask-image:var(--ico-asr);
                width:150px; height:150px; margin-bottom:14px; }
  .ico--info{   -webkit-mask-image:var(--ico-info);   mask-image:var(--ico-info); }
  .tile .label{
    font-size:34px;
    line-height:34px;
    letter-spacing:.02em;
    text-indent:.02em;
    font-weight:300;
    color:#40503f;
    transition:color .22s ease;
  }

  /* 选中态：4px 深绿外框 + 8px 白色内环 + 墨绿填充 */
  .tile.is-active{
    background:var(--active);
    border-color:#3a533e;
    box-shadow:inset 0 0 0 3px #3a533e;
  }
  .tile.is-active .ico,
  .tile.is-active .label{ color:#fff; }
  .tile.is-active .ico{ background-color:#fff; }
  .tile.is-active::after{
    content:"";
    position:absolute; inset:3px;
    border:8px solid #fff;
    pointer-events:none;
  }

  /* 未读角标 */
  .badge{
    position:absolute;
    top:57px; right:62px;
    min-width:34px; height:34px;
    padding:0 9px;
    display:flex; align-items:center; justify-content:center;
    border-radius:17px;
    background:#c5352d;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:20px; font-weight:600;
    line-height:1;
    box-shadow:0 0 0 3px rgba(255,255,255,.9);
  }
  .tile.is-active .badge{ box-shadow:0 0 0 3px rgba(76,106,85,.9); }

  /* ---------- 右下操作提示 ---------- */
  .hint{
    position:absolute;
    right:119px; bottom:23px;
    display:flex; align-items:center; gap:9px;
    font-size:24.5px;
    letter-spacing:.05em;
    color:#4c5c51;
  }
  .hint svg{ width:24px; height:24px; display:block; opacity:.9; }

  /* ---------- 栏目详情：整页截图（左右键可翻页） ---------- */
  .detail{
    position:absolute; left:0; top:0;
    width:1920px; height:1080px;
    display:block;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility .25s;
    z-index:25;
  }
  .detail.is-open{ opacity:1; visibility:visible; }
  .detail.no-anim{ transition:none; }

  /* ---------- 进入后的占位页面 ---------- */
  .overlay{
    position:absolute; inset:0;
    z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(1100px 700px at 50% 0%, #f6fafd 0%, rgba(246,250,253,0) 65%),
      linear-gradient(180deg,#eaf1f8 0%,#dfe8f2 100%);
    opacity:0;
    visibility:hidden;
    transform:translateY(24px);
    transition:opacity .32s ease, transform .32s ease, visibility .32s;
  }
  .overlay.is-open{
    opacity:1; visibility:visible; transform:none;
  }
  .overlay.no-anim{ transition:none; }
  .overlay .eyebrow{
    font-family:Georgia,serif;
    font-size:20px;
    letter-spacing:.42em;
    text-indent:.42em;
    color:rgba(62,91,71,.72);
    text-transform:uppercase;
  }
  .overlay .page-title{
    margin:22px 0 0;
    font-size:76px;
    font-weight:300;
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--ink);
  }
  .overlay .page-rule{
    width:120px; height:2px; margin:34px 0 30px;
    background:rgba(62,91,71,.35);
  }
  .overlay .page-note{
    font-size:22px;
    letter-spacing:.06em;
    color:#6a7a70;
  }
  .overlay .page-back{
    position:absolute;
    right:116px; bottom:26px;
    display:flex; align-items:center; gap:9px;
    font-size:20px;
    letter-spacing:.05em;
    color:#4c5c51;
  }
</style>
</head>

<body>
<div class="stage" id="stage">

  <!-- ============ 左栏 ============ -->
  <section class="brand-col">
    <!-- 字标为临时素材：从参考图提取的透明 PNG（somerset + 中英文案锁形）。
         拿到官方矢量字标后，直接替换 assets/brand/logo-lockup.png 即可（保持 496×143）。 -->
    <img class="lockup" src="assets/brand/logo-lockup.png" width="496" height="143"
         alt="Somerset Pudong Riverside Shanghai" />

    <div class="hero-frame">
      <div class="hero-media is-booting" id="heroMedia">
        <div class="slide is-on"></div>

        <div class="dots" id="dots" role="tablist" aria-label="酒店图片轮播"></div>
      </div>
    </div>
  </section>

  <!-- ============ 右上状态栏 ============ -->
  <div class="statusbar">
    <span class="clock-date" id="clockDate">2025.11</span>
    <span class="clock-time" id="clockTime">10:20</span>
    <span class="weather">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="31" cy="15.5" r="6.2" stroke="currentColor" stroke-width="2.3"/>
        <path d="M31 4.6v3.2M31 23.2v3.2M20.3 15.5h3.2M38.5 15.5h3.2M23.6 8.1l2.3 2.3M36.1 20.6l2.3 2.3M23.6 22.9l2.3-2.3M36.1 10.4l2.3-2.3"
              stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M18 39.5h16.6a6.8 6.8 0 0 0 .5-13.6 9.2 9.2 0 0 0-17.4-1.4A6.1 6.1 0 0 0 18 39.5z"
              stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" fill="#eef5fb"/>
      </svg>
      <span class="temp">25°C</span>
    </span>
  </div>

  <!-- ============ 右上功能宫格 ============ -->
  <nav class="grid" id="grid" role="grid" aria-label="主菜单">

    <button class="tile is-active" type="button" role="gridcell" data-page="看电视" data-key="tv" aria-label="看电视">
      <span class="ico ico--tv" aria-hidden="true"></span>
      <span class="label">看电视</span>
    </button>

    <button class="tile" type="button" role="gridcell" data-page="酒店介绍" data-key="hotel" aria-label="酒店介绍">
      <span class="ico ico--hotel" aria-hidden="true"></span>
      <span class="label">酒店介绍</span>
    </button>

    <button class="tile" type="button" role="gridcell" data-page="极光TV" data-key="aurora" aria-label="极光TV">
      <span class="ico ico--aurora" aria-hidden="true"></span>
      <span class="label">极光TV</span>
    </button>

    <button class="tile" type="button" role="gridcell" data-page="无线投屏" data-key="cast" aria-label="无线投屏">
      <span class="ico ico--cast" aria-hidden="true"></span>
      <span class="label">无线投屏</span>
    </button>

    <button class="tile" type="button" role="gridcell" data-page="雅星会" data-key="asr" aria-label="雅星会">
      <span class="ico ico--asr" aria-hidden="true"></span>
      <span class="label">雅星会</span>
    </button>

    <button class="tile" type="button" role="gridcell" data-page="信息中心" data-key="info" aria-label="信息中心，2 条未读">
      <span class="ico ico--info" aria-hidden="true"></span>
      <span class="label">信息中心</span>
      <span class="badge">2</span>
    </button>

  </nav>

  <!-- ============ 右下提示 ============ -->
  <div class="hint">
    <span>按</span>
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2.5 9.4 5.1M12 2.5l2.6 2.6M2.5 12l2.6-2.6M2.5 12l2.6 2.6M12 21.5l-2.6-2.6M12 21.5l2.6-2.6M21.5 12l-2.6-2.6M21.5 12l-2.6 2.6"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.7"/>
    </svg>
    <span>切换位置，按“OK”进入</span>
  </div>

  <!-- ============ 栏目详情（整页截图，左右键翻页） ============ -->
  <img class="detail" id="detail" alt="" />

  <!-- ============ 尚未提供截图的栏目：占位页 ============ -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="eyebrow">Somerset · Pudong Riverside</div>
    <h2 class="page-title" id="pageTitle">看电视</h2>
    <div class="page-rule"></div>
    <div class="page-note" id="pageNote">页面占位：接入该功能的内容源后即可使用</div>
    <div class="page-back">
      <span>按</span>
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22" aria-hidden="true">
        <path d="M11 5 4 12l7 7M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>或“返回”键退出</span>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ---------------- 1. 舞台等比缩放 ---------------- */
  const stage = document.getElementById('stage');
  function fitStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  /* ---------------- 2. 时钟（实时） ---------------- */
  const elDate = document.getElementById('clockDate');
  const elTime = document.getElementById('clockTime');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tickClock() {
    const d = new Date();
    elDate.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1);
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------------- 3. 主图轮播 ---------------- */
  /* 先把 assets/photos/hero-1.jpg … hero-5.jpg 全部探测一遍，
     有几张就轮播几张（没有的话保留占位图并隐藏圆点）。 */
  const heroMedia = document.getElementById('heroMedia');
  const dotsBox = document.getElementById('dots');
  const HERO_MAX = 5;
  let slides = [];
  let dots = [];
  let current = 0;
  let timer = null;

  function buildDots(n) {
    dotsBox.innerHTML = '';
    dots = [];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button');
      b.className = 'dot' + (i === 0 ? ' is-on' : '');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 张图片');
      b.addEventListener('click', () => { go(i); restart(); });
      dotsBox.appendChild(b);
      dots.push(b);
    }
    dotsBox.style.display = n > 1 ? '' : 'none';
  }

  function go(i) {
    if (!slides.length) return;
    current = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle('is-on', k === current));
    dots.forEach((d, k) => d.classList.toggle('is-on', k === current));
  }

  function restart() {
    clearInterval(timer);
    if (slides.length > 1) timer = setInterval(() => go(current + 1), 6000);
  }

  function probe(src) {
    return new Promise(function (resolve) {
      const im = new Image();
      im.onload = function () { resolve(src); };
      im.onerror = function () { resolve(null); };
      im.src = src;
    });
  }

  const heroList = [];
  for (let i = 1; i <= HERO_MAX; i++) heroList.push('assets/photos/hero-' + i + '.jpg');

  Promise.all(heroList.map(probe)).then(function (loaded) {
    const ok = loaded.filter(Boolean);
    if (ok.length) {
      heroMedia.querySelectorAll('.slide').forEach(function (el) { el.remove(); });
      slides = ok.map(function (src, i) {
        const d = document.createElement('div');
        d.className = 'slide' + (i === 0 ? ' is-on' : '');
        d.style.backgroundImage = 'url("' + src + '")';
        heroMedia.insertBefore(d, dotsBox);
        return d;
      });
      buildDots(slides.length);
      /* 联调：index.html?slide=2 直接停在第 2 张 */
      const want = parseInt(new URLSearchParams(location.search).get('slide') || '1', 10);
      go(isNaN(want) ? 0 : want - 1);
      restart();
    }
    requestAnimationFrame(function () { heroMedia.classList.remove('is-booting'); });
  });

  /* ---------------- 4. 宫格焦点导航 ---------------- */
  const tiles = Array.from(document.querySelectorAll('.tile'));
  const COLS = 2;
  let focusIndex = 0;

  function setFocus(i) {
    focusIndex = (i + tiles.length) % tiles.length;
    tiles.forEach((t, k) => t.classList.toggle('is-active', k === focusIndex));
  }

  tiles.forEach((t, i) => {
    t.addEventListener('mouseenter', () => setFocus(i));
    t.addEventListener('focus', () => setFocus(i));
    t.addEventListener('click', () => openPage(t));
  });

  function moveFocus(key) {
    const row = Math.floor(focusIndex / COLS);
    const col = focusIndex % COLS;
    let r = row, c = col;

    if (key === 'ArrowRight') c = (col + 1) % COLS;
    else if (key === 'ArrowLeft') c = (col - 1 + COLS) % COLS;
    else if (key === 'ArrowDown') r = (row + 1) % 3;
    else if (key === 'ArrowUp') r = (row - 1 + 3) % 3;

    setFocus(r * COLS + c);
  }

  /* ---------------- 5. 进入 / 退出栏目 ----------------
     有截图的栏目直接铺图（可左右翻页），没有的先用占位页 */
  const overlay = document.getElementById('overlay');
  const pageTitle = document.getElementById('pageTitle');
  const detail = document.getElementById('detail');
  let overlayOpen = false;

  const SHOTS = {
    aurora: ['assets/screens/somerset/home/aurora.jpg'],
    cast:   ['assets/screens/somerset/home/cast.jpg'],
    asr:    ['assets/screens/somerset/home/asr.jpg'],
    info:   ['assets/screens/somerset/home/info-1.jpg', 'assets/screens/somerset/home/info-2.jpg']
  };
  let shotList = [];
  let shotIndex = 0;

  function openPage(tile, instant) {
    /* 「酒店介绍」已经有独立页面（截图铺底 + 宫格交互），直接跳转 */
    if (tile.dataset.key === 'hotel') { location.href = 'hotel.html'; return; }

    const list = SHOTS[tile.dataset.key];
    if (list) {
      if (instant) detail.classList.add('no-anim');
      shotList = list;
      shotIndex = 0;
      detail.src = list[0];
      detail.classList.add('is-open');
      overlayOpen = true;
      return;
    }

    /* 还没有截图的栏目（看电视）：占位页 */
    if (instant) overlay.classList.add('no-anim');
    pageTitle.textContent = tile.dataset.page;
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    overlayOpen = true;
  }
  function closePage() {
    detail.classList.remove('is-open');
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    overlayOpen = false;
  }
  function turnPage(dir) {
    if (shotList.length < 2) return;
    shotIndex = (shotIndex + dir + shotList.length) % shotList.length;
    detail.src = shotList[shotIndex];
  }
  detail.addEventListener('click', closePage);

  /* 预热截图，切换时无白闪 */
  Object.keys(SHOTS).forEach(function (k) {
    SHOTS[k].forEach(function (src) { const im = new Image(); im.src = src; });
  });

  /* ---------------- 6. 遥控器按键 ---------------- */
  document.addEventListener('keydown', function (e) {
    const k = e.key;

    if (overlayOpen) {
      if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack') {
        e.preventDefault();
        closePage();
        return;
      }
      /* 详情页左右翻页（信息中心有 2 页） */
      if (k === 'ArrowRight' || k === 'ArrowLeft') {
        e.preventDefault();
        turnPage(k === 'ArrowRight' ? 1 : -1);
      }
      return;
    }

    /* 数字键直达第 N 个栏目（遥控器数字键盘） */
    if (/^[1-9]$/.test(k)) {
      const n = parseInt(k, 10);
      if (n <= tiles.length) { e.preventDefault(); setFocus(n - 1); }
      return;
    }

    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      moveFocus(k);
      return;
    }
    if (k === 'Enter' || k === ' ' || k === 'OK' || k === 'Select') {
      e.preventDefault();
      const t = tiles[focusIndex];
      if (t) openPage(t);
      return;
    }
    /* 遥控器数字键 / 左右翻图（可选） */
    if (k === 'PageDown') { go(current + 1); restart(); }
    if (k === 'PageUp') { go(current - 1); restart(); }
  });

  /* 便于联调（截图/演示用）：
     ?open=1 或 ?open=aurora 直接打开某个栏目；?shot=2 停在详情第 2 页 */
  (function () {
    const q = new URLSearchParams(location.search);
    const v = q.get('open');
    if (!v) return;
    const t = /^\d$/.test(v) ? tiles[parseInt(v, 10) - 1]
                             : tiles.filter(function (x) { return x.dataset.key === v; })[0];
    if (!t) return;
    openPage(t, true);
    const s = parseInt(q.get('shot') || '1', 10);
    while (shotList.length > 1 && shotIndex < s - 1) turnPage(1);
  })();

  /* 触屏 / 鼠标：手势左右滑动切图（可选） */
  const hero = document.getElementById('heroMedia');
  let startX = null;
  hero.addEventListener('pointerdown', e => { startX = e.clientX; });
  hero.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 60) { go(current + (dx < 0 ? 1 : -1)); restart(); }
    startX = null;
  });

  /* ---------------- 8. 电视外壳（tv.html）注入的遥控按键 ---------------- */
  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.type !== 'remote' || !d.key) return;
    document.dispatchEvent(new KeyboardEvent('keydown', {
      key: String(d.key), bubbles: true, cancelable: true
    }));
  });
})();
</script>

<!-- 「作品集」用：把滚轮转给外层电视壳（单独打开时不影响） -->
<script>
addEventListener('wheel', function (e) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ type: 'wheel', dy: e.deltaY }, '*'); } catch (err) {}
}, { passive: true });
</script>
</body>
