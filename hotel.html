  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#dfe7f0; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    font-family:"Microsoft YaHei Light","Microsoft YaHei UI Light","Microsoft YaHei UI","Microsoft YaHei",
                "PingFang SC","Noto Sans SC",sans-serif;
    font-weight:300; color:#46564b; user-select:none; cursor:default;
  }

  /* 1920×1080 舞台，整体等比缩放 */
  .stage{
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--scale,1));
    background:var(--bg);
    overflow:hidden;
  }

  /* 设计稿截图（照片 / Welcome / 底部大 logo 都在里面） */
  .shot{
    position:absolute; left:0; top:0;
    width:1920px; height:1080px;
    display:block;
    pointer-events:none;
  }

  /* 把截图里烘焙的宫格 / 状态栏 / 提示盖掉，改用代码绘制 */
  .cover{ position:absolute; background:var(--bg); }
  .cover-grid  { left:1232px; top:383px; width:570px; height:570px; }
  .cover-status{ left:1358px; top:28px;  width:450px; height:78px;  }
  .cover-hint  { left:1458px; top:1012px; width:350px; height:50px; }

  /* ---------- 状态栏（与首页同一套参数） ---------- */
  .statusbar{
    position:absolute; left:1232px; top:44px; width:572px; padding-right:7px;
    display:flex; align-items:center; justify-content:flex-end;
    font-family:"Segoe UI Light","Segoe UI","Microsoft YaHei UI Light",sans-serif;
    font-size:28px; line-height:40px; letter-spacing:.04em; color:#3f4f45;
  }
  .clock-date{ font-variant-numeric:tabular-nums; }
  .clock-time{ margin-left:57px; font-variant-numeric:tabular-nums; }
  .weather{ margin-left:66px; display:flex; align-items:center; gap:12px; }
  .weather svg{ width:58px; height:58px; display:block; }
  .temp{ font-size:30px; font-variant-numeric:tabular-nums; }

  /* ---------- 2×2 功能宫格 ---------- */
  .grid{
    position:absolute; left:1233px; top:384px; width:568px;
    display:grid;
    grid-template-columns:repeat(2,280px);
    grid-auto-rows:280px;
    gap:8px;
  }
  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0 10px 51px;
    background:#fff; border:1px solid #e2e9ef; color:var(--ink);
    font-family:inherit; text-align:center; cursor:pointer; outline:none;
    transition:background .22s ease, color .22s ease, border-color .22s ease;
  }
  .tile .ico{
    width:130px; height:130px; display:block; margin-bottom:24px; flex:none;
    background-color:currentColor;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    transition:background-color .22s ease;
  }
  .ico--svc{  -webkit-mask-image:var(--ico-svc);  mask-image:var(--ico-svc); }
  .ico--room{ -webkit-mask-image:var(--ico-room); mask-image:var(--ico-room); }
  .ico--gym{  -webkit-mask-image:var(--ico-gym);  mask-image:var(--ico-gym); }
  .ico--dine{ -webkit-mask-image:var(--ico-dine); mask-image:var(--ico-dine); }
  .tile .label{
    font-size:34px; line-height:34px; letter-spacing:.02em; text-indent:.02em;
    font-weight:300; color:#40503f; transition:color .22s ease;
  }

  /* 选中态：深绿外框 4px + 白色内环 8px + 墨绿填充 */
  .tile.is-active{
    background:var(--active);
    border-color:var(--edge);
    box-shadow:inset 0 0 0 3px var(--edge);
  }
  .tile.is-active .ico,
  .tile.is-active .label{ color:#fff; }
  .tile.is-active .ico{ background-color:#fff; }
  .tile.is-active::after{
    content:"";
    position:absolute; inset:3px;
    border:8px solid #fff;
    pointer-events:none;
  }

  /* ---------- 底部操作提示（与首页同一套参数） ---------- */
  .hint{
    position:absolute; right:119px; bottom:23px;
    display:flex; align-items:center; gap:9px;
    font-size:24.5px; letter-spacing:.05em; color:#4c5c51;
  }
  .hint svg{ width:24px; height:24px; display:block; opacity:.9; }

  /* ---------- 栏目详情：整页截图直接铺满 ---------- */
  .detail{
    position:absolute; left:0; top:0;
    width:1920px; height:1080px;
    display:block;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility .25s;
    z-index:30;
  }
  .detail.is-open{ opacity:1; visibility:visible; }
  .detail.no-anim{ transition:none; }
</style>

<body>
<div class="stage" id="stage">

  <!-- 设计稿截图：照片 / Welcome 字 / 底部大 logo -->
  <img class="shot" src="assets/screens/somerset/hotel-intro.jpg" alt="酒店介绍" />

  <!-- 盖掉截图里烘焙的宫格、状态栏、提示 -->
  <div class="cover cover-grid"></div>
  <div class="cover cover-status"></div>
  <div class="cover cover-hint"></div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <span class="clock-date" id="clockDate">2025.11</span>
    <span class="clock-time" id="clockTime">10:20</span>
    <span class="weather">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="31" cy="15.5" r="6.2" stroke="currentColor" stroke-width="2.3"/>
        <path d="M31 4.6v3.2M31 23.2v3.2M20.3 15.5h3.2M38.5 15.5h3.2M23.6 8.1l2.3 2.3M36.1 20.6l2.3 2.3M23.6 22.9l2.3-2.3M36.1 10.4l2.3-2.3"
              stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M18 39.5h16.6a6.8 6.8 0 0 0 .5-13.6 9.2 9.2 0 0 0-17.4-1.4A6.1 6.1 0 0 0 18 39.5z"
              stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" fill="#eef5fb"/>
      </svg>
      <span class="temp">25°C</span>
    </span>
  </div>

  <!-- 2×2 栏目 -->
  <nav class="grid" id="grid" role="grid" aria-label="酒店介绍栏目">
    <button class="tile is-active" type="button" role="gridcell" data-page="公寓服务" data-shot="assets/screens/somerset/hotel/svc.jpg" aria-label="公寓服务">
      <span class="ico ico--svc" aria-hidden="true"></span>
      <span class="label">公寓服务</span>
    </button>
    <button class="tile" type="button" role="gridcell" data-page="客房与套房" data-shot="assets/screens/somerset/hotel/room.jpg" aria-label="客房与套房">
      <span class="ico ico--room" aria-hidden="true"></span>
      <span class="label">客房与套房</span>
    </button>
    <button class="tile" type="button" role="gridcell" data-page="健身" data-shot="assets/screens/somerset/hotel/gym.jpg" aria-label="健身">
      <span class="ico ico--gym" aria-hidden="true"></span>
      <span class="label">健身</span>
    </button>
    <button class="tile" type="button" role="gridcell" data-page="餐厅服务" data-shot="assets/screens/somerset/hotel/dine.jpg" aria-label="餐厅服务">
      <span class="ico ico--dine" aria-hidden="true"></span>
      <span class="label">餐厅服务</span>
    </button>
  </nav>

  <!-- 底部提示 -->
  <div class="hint">
    <span>按</span>
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2.5 9.4 5.1M12 2.5l2.6 2.6M2.5 12l2.6-2.6M2.5 12l2.6 2.6M12 21.5l-2.6-2.6M12 21.5l2.6-2.6M21.5 12l-2.6-2.6M21.5 12l-2.6 2.6"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.7"/>
    </svg>
    <span>切换位置，按“OK”进入</span>
  </div>

  <!-- 栏目详情：整页截图（按 OK 切换显示，返回键退回） -->
  <img class="detail" id="detail" alt="" />

</div>

<script>
(function () {
  'use strict';

  /* 舞台等比缩放 */
  const stage = document.getElementById('stage');
  function fitStage() {
    stage.style.setProperty('--scale', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  /* 时钟 */
  const elDate = document.getElementById('clockDate');
  const elTime = document.getElementById('clockTime');
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function tickClock() {
    const d = new Date();
    elDate.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1);
    elTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* 4 个卡片的焦点导航 */
  const tiles = Array.from(document.querySelectorAll('.tile'));
  const COLS = 2, ROWS = 2;
  let focusIndex = 0;

  function setFocus(i) {
    focusIndex = (i + tiles.length) % tiles.length;
    tiles.forEach((t, k) => t.classList.toggle('is-active', k === focusIndex));
  }
  tiles.forEach((t, i) => {
    t.addEventListener('mouseenter', () => setFocus(i));
    t.addEventListener('focus', () => setFocus(i));
    t.addEventListener('click', () => openPage(t));
  });

  /* 联调：hotel.html?focus=3 直接把焦点放在第 3 个栏目 */
  const wantFocus = parseInt(new URLSearchParams(location.search).get('focus') || '1', 10);
  if (!isNaN(wantFocus)) setFocus(wantFocus - 1);

  /* 栏目详情：直接把该栏目的整页截图铺满（截图里自带「返回上级菜单」和页码） */
  const detail = document.getElementById('detail');
  let overlayOpen = false;

  function openPage(tile, instant) {
    if (instant) detail.classList.add('no-anim');
    if (tile.dataset.shot) detail.src = tile.dataset.shot;
    detail.classList.add('is-open');
    overlayOpen = true;
  }
  function closePage() {
    detail.classList.remove('is-open');
    overlayOpen = false;
  }
  /* 鼠标点击详情页 = 返回（遥控器用返回键） */
  detail.addEventListener('click', closePage);

  /* 预热四张详情截图，切换时无白闪 */
  ['svc', 'room', 'gym', 'dine'].forEach(function (k) {
    const im = new Image();
    im.src = 'assets/screens/somerset/hotel/' + k + '.jpg';
  });

  document.addEventListener('keydown', function (e) {
    const k = e.key;

    if (overlayOpen) {
      if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack') {
        e.preventDefault();
        closePage();
      }
      return;
    }

    if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack') {
      e.preventDefault();
      location.href = 'index.html';
      return;
    }
    /* 数字键直达第 N 个栏目 */
    if (/^[1-9]$/.test(k)) {
      const n = parseInt(k, 10);
      if (n <= tiles.length) { e.preventDefault(); setFocus(n - 1); }
      return;
    }
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      const row = Math.floor(focusIndex / COLS), col = focusIndex % COLS;
      let r = row, c = col;
      if (k === 'ArrowRight') c = (col + 1) % COLS;
      else if (k === 'ArrowLeft') c = (col - 1 + COLS) % COLS;
      else if (k === 'ArrowDown') r = (row + 1) % ROWS;
      else if (k === 'ArrowUp') r = (row - 1 + ROWS) % ROWS;
      setFocus(r * COLS + c);
      return;
    }
    if (k === 'Enter' || k === ' ' || k === 'OK' || k === 'Select') {
      e.preventDefault();
      const t = tiles[focusIndex];
      if (t) openPage(t);
    }
  });

  /* 联调：hotel.html?open=3 直接打开第 3 个栏目的详情页（方便截图） */
  const openN = parseInt(new URLSearchParams(location.search).get('open') || '0', 10);
  if (openN > 0) openPage(tiles[(openN - 1) % tiles.length], true);
  /* 电视外壳（tv.html）注入的遥控按键 */
  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d || d.type !== 'remote' || !d.key) return;
    document.dispatchEvent(new KeyboardEvent('keydown', {
      key: String(d.key), bubbles: true, cancelable: true
    }));
  });
})();
</script>

<!-- 「作品集」用：把滚轮转给外层电视壳（单独打开时不影响） -->
<script>
addEventListener('wheel', function (e) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ type: 'wheel', dy: e.deltaY }, '*'); } catch (err) {}
}, { passive: true });
</script>
